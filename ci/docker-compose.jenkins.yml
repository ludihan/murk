name: murk-jenkins

services:
  jenkins:
    build: ./jenkins
    restart: unless-stopped
    networks:
      - web
    ports:
      - "127.0.0.1:8080:8080"   # public only through Caddy, at https://jenkins.ludihan.com; this port is for an SSH tunnel
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:

networks:
  web:
    name: murk-web
    external: true              # created by the site stack (docker-compose.yml): deploy that first

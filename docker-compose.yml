services:
  murk:
    build: .
    restart: unless-stopped
    networks:
      - web                     # shared with Jenkins so Caddy can forward GitHub's webhook to it
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data        # keeps the HTTPS certificate across rebuilds
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: murk-web
    external: true              # created once: docker network create murk-web

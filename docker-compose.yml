services:
  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]   # Caddy's admin API
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web                     # shared with Jenkins so Caddy can forward GitHub's webhook to it
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - site:/srv:ro            # the game, published by the "site" service
      - caddy_data:/data        # keeps the HTTPS certificate across rebuilds
      - caddy_config:/config

  # One-shot: builds the game and swaps it into the site volume (run by deploy.sh, not started by `up`)
  site:
    build:
      context: .
      target: site
    profiles: [deploy]
    volumes:
      - site:/site

volumes:
  site:
  caddy_data:
  caddy_config:

networks:
  web:
    name: murk-web
    external: true              # created once: docker network create murk-web

services:
  murk:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]   # Caddy's admin API
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web                     # shared with Jenkins so Caddy can forward GitHub's webhook to it
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data        # keeps the HTTPS certificate across rebuilds
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: murk-web
    external: true              # created once: docker network create murk-web

name: murk

services:
  caddy:
    build:
      context: .
      target: caddy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]   # Caddy's admin API
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web                     # shared with Jenkins so Caddy can forward GitHub's webhook to it
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - site:/srv:ro            # the game, published by the "site" service
      - caddy_data:/data        # keeps the HTTPS certificate across rebuilds
      - caddy_config:/config

  # One-shot: builds the game and swaps it into the site volume. It runs to completion on every `up` that rebuilt it,
  # while caddy (no depends_on, so it is never recreated for it) keeps serving the previous release.
  site:
    build:
      context: .
      target: site
    restart: "no"
    volumes:
      - site:/site

volumes:
  site:
  caddy_data:
  caddy_config:

networks:
  web:
    name: murk-web              # fixed name so the Jenkins stack can join it
